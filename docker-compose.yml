services:
  civicresolve:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civicresolve_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=file:/data/civicresolve.db
      - UPLOAD_DIR=/uploads
      - APP_URL=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET:-${JWT_SECRET}}
    volumes:
      - civicresolve_data:/data
      - civicresolve_uploads:/uploads

volumes:
  civicresolve_data:
    driver: local
  civicresolve_uploads:
    driver: local
